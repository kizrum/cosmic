<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cosmic — Солнечная система</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%23ffb347' stroke-width='4'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="labels"></div>

    <div id="hud">
      <header class="topbar">
        <div class="brand"><span class="logo"></span>COSMIC<em data-i18n="subtitle">Навигационная карта</em></div>
        <nav id="crumbs"></nav>
        <div class="lang" data-i18n-title="langTitle">
          <button data-lang="ru">RU</button><button data-lang="en">EN</button>
        </div>
        <div class="time">
          <button id="btn-play" data-i18n-title="playTitle" aria-label="Пауза"><i></i></button>
          <div class="speed" data-i18n-title="speedTitle">
            <button id="speed-down" data-i18n-aria="slower">‹</button>
            <span id="speed-label">1×</span>
            <button id="speed-up" data-i18n-aria="faster">›</button>
          </div>
          <button id="date-btn" aria-haspopup="dialog" aria-expanded="false" data-i18n-title="pickDate">
            <span class="live" data-i18n-title="realtime"></span><span id="sim-date">—</span><span class="caret"></span>
          </button>
          <div id="date-pop" hidden>
            <label><span data-i18n="dateLabel">Дата и время, UTC</span><input id="date-input" type="datetime-local" step="60" /></label>
            <button id="btn-now" data-i18n="now">Сейчас</button>
          </div>
        </div>
      </header>

      <div class="toolbar">
        <button id="nav-toggle" aria-expanded="false" aria-controls="nav" data-i18n-title="objectsTitle">
          <span class="bars"><i></i><i></i><i></i></span><span data-i18n="objects">Объекты</span>
        </button>
        <div class="toggles">
          <button id="btn-orbits" data-i18n-title="orbitsTitle" data-i18n="orbits">Орбиты</button>
          <button id="btn-light" data-i18n-title="lightTitle" data-i18n="light">Подсветка</button>
          <button id="btn-scale" data-i18n-title="scaleTitle" data-i18n="scale">Реальный масштаб</button>
        </div>
      </div>
      <aside id="nav">
        <div id="nav-groups"></div>
      </aside>

      <section id="panel"></section>

      <footer id="hint"></footer>
      <button id="btn-credits" class="note" data-i18n="credits">Источники и лицензии</button>
    </div>

    <dialog id="credits">
      <div class="credits-head">
        <h2 data-i18n="creditsTitle">Источники и лицензии</h2>
        <button class="credits-close" data-i18n-aria="close">✕</button>
      </div>
      <div id="credits-body"></div>
    </dialog>

    <div id="loader">
      <div class="loader-inner">
        <div class="loader-title">COSMIC</div>
        <div class="loader-sub" data-i18n="loading">Загрузка карт поверхностей…</div>
        <div class="loader-track"><div id="loader-bar"></div></div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
