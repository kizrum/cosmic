<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cosmic — Солнечная система</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%23ffb347' stroke-width='4'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="labels"></div>

    <div id="hud">
      <header class="topbar">
        <div class="brand"><span class="logo"></span>COSMIC<em>Навигационная карта</em></div>
        <nav id="crumbs"></nav>
        <div class="time">
          <button id="btn-play" title="Пауза / продолжить (Пробел)" aria-label="Пауза"><i></i></button>
          <div class="speed" title="Скорость времени (клавиши , и .)">
            <button id="speed-down" aria-label="Медленнее">‹</button>
            <span id="speed-label">1×</span>
            <button id="speed-up" aria-label="Быстрее">›</button>
          </div>
          <button id="date-btn" aria-haspopup="dialog" aria-expanded="false" title="Выбрать дату">
            <span class="live" title="Реальное время"></span><span id="sim-date">—</span><span class="caret"></span>
          </button>
          <div id="date-pop" hidden>
            <label>Дата и время, UTC<input id="date-input" type="datetime-local" step="60" /></label>
            <button id="btn-now">Сейчас</button>
          </div>
        </div>
      </header>

      <div class="toolbar">
        <button id="nav-toggle" aria-expanded="false" aria-controls="nav" title="Список объектов">
          <span class="bars"><i></i><i></i><i></i></span>Объекты
        </button>
        <div class="toggles">
          <button id="btn-orbits" title="Показать или скрыть орбиты">Орбиты</button>
          <button id="btn-light" title="Подсветка ночной стороны (L)">Подсветка</button>
        </div>
      </div>
      <aside id="nav">
        <div id="nav-groups"></div>
      </aside>

      <section id="panel"></section>

      <footer id="hint"></footer>
      <button id="btn-credits" class="note">Масштаб условный · Источники и лицензии</button>
    </div>

    <dialog id="credits">
      <div class="credits-head">
        <h2>Источники и лицензии</h2>
        <button class="credits-close" aria-label="Закрыть">✕</button>
      </div>
      <div id="credits-body"></div>
    </dialog>

    <div id="loader">
      <div class="loader-inner">
        <div class="loader-title">COSMIC</div>
        <div class="loader-sub">Загрузка карт поверхностей…</div>
        <div class="loader-track"><div id="loader-bar"></div></div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
